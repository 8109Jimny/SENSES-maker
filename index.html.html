<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unicode Matrix Editor</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101114;color:#f4f4f5;font:14px system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}h1{font-size:21px}button,input,select{font:inherit}button{background:#292b31;border:1px solid #454750;color:inherit;border-radius:9px;padding:9px;cursor:pointer}button:hover{background:#41444d}button.primary{background:#e8e8ea;color:#111;border:0}input,select{background:#22242a;color:inherit;border:1px solid #555;border-radius:7px;padding:9px;max-width:100%}.card{border:1px solid #37383e;border-radius:15px;padding:16px;margin:14px 0}.preview{text-align:center;background:#191b20}.face{font-size:32px;min-height:65px;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:10px 0}.spread{justify-content:space-between}.matrix{overflow-x:auto}.grid{display:grid;gap:3px;min-width:680px}.cell{min-height:42px;padding:4px;border-radius:5px;font-size:15px}.cell.active{outline:2px solid #6c9efb;background:#243249}.cell.filled{background:#31343b}.head{font-size:12px;text-align:center}.rowlabel{font-size:12px;display:flex;align-items:center}.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px}.palette button{min-height:46px;font-size:20px}.muted{color:#a6a7b0;font-size:12px}.hidden{display:none}.dictionary-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}.dictionary-grid button{padding:9px 1px;min-width:0;font-size:17px}.dictionary-grid button.active{outline:2px solid #6c9efb}details{border:1px solid #454750;border-radius:11px;padding:12px;margin:12px 0}summary{cursor:pointer;font-weight:600}.fill{flex:1}.small{font-size:12px}.controls{display:flex;gap:7px;flex-wrap:wrap}label{cursor:pointer}@media(max-width:600px){.wrap{padding:10px}.face{font-size:27px}.card{padding:12px}.dictionary-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}</style></head><body><main class="wrap"><h1>Unicode Matrix Editor</h1><p class="muted">顔文字制作・Unicode記号辞典 統合版</p><section class="card preview"><div class="muted">完成プレビュー</div><div id="face" class="face"></div><button id="copy" class="primary" style="width:100%">Unicode文字列をコピー</button><p id="copyStatus" class="muted"></p></section><div class="row spread"><b>番地数</b><div class="controls"><button id="minus">−</button><strong id="count">8</strong><button id="plus">＋</button></div></div><label><input id="overlayOn" type="checkbox" checked> 重結合文字でベース文字を置換する</label><div class="row spread"><b>番地 × 結合レイヤー</b><div class="controls"><button id="undo">↶</button><button id="redo">↷</button></div></div><div class="matrix"><div id="matrix" class="grid"></div></div><button id="toggleLayers" style="width:100%;margin-top:9px">全13レイヤーを表示 ▾</button><section class="card"><div class="row spread"><b id="activeLabel">番地2・上結合1</b><button id="clear">消去</button></div><div class="muted" id="activeValue"></div><details open><summary>クイック記号パレット</summary><div id="palette" class="palette" style="margin-top:12px"></div><div class="row"><input class="fill" id="manual" placeholder="Unicode文字を直接入力"><button id="backspace">最後の1文字を削除</button></div></details><details id="dictionary"><summary>Unicode記号辞典 — 範囲検索・コピー・番地へ挿入</summary><div class="row"><select id="range" class="fill"></select></div><div class="row"><input id="hex" placeholder="Unicode番号（例：FE20）" value="FE20"><button id="jump">検索</button><button id="favorites">☆ お気に入り</button></div><div class="row spread"><span id="pageInfo" class="muted"></span><div class="controls"><button id="prev">◀</button><button id="next">▶</button></div></div><div id="symbols" class="dictionary-grid"></div><div class="card"><div class="row"><span id="selectedSymbol" style="font-size:28px"></span><b id="selectedCode"></b><button id="star">☆</button></div><div class="row"><button id="copySymbol">記号単体をコピー</button><button id="insertSymbol" class="primary">選択セルへ挿入</button></div></div><p class="muted">◌ は結合記号を見やすくするための補助表示で、コピーには含みません。未割当文字やフォント非対応文字は表示されないことがあります。</p></details></section><section class="card"><b>表示調整</b><div class="row">プレビュー文字サイズ <input id="fontSize" type="range" min="16" max="48" value="32"><span id="fontSizeValue">32px</span></div><div class="row">セルの高さ <input id="cellHeight" type="range" min="32" max="64" value="42"><span id="cellHeightValue">42px</span></div><button id="reset">初期状態に戻す</button></section></main><script>
const layers=[['topPlus','上結合＋'],['top3','上結合3'],['top2','上結合2'],['top1','上結合1'],['base','ベース文字'],['bottom1','下結合1'],['bottom2','下結合2'],['bottom3','下結合3'],['bottomPlus','下結合＋'],['overlay1','重結合1'],['overlay2','重結合2'],['overlay3','重結合3'],['overlayPlus','重結合＋']];const order=['top1','top2','top3','topPlus','bottom1','bottom2','bottom3','bottomPlus'];const overlays=['overlay1','overlay2','overlay3','overlayPlus'];const blank=()=>Object.fromEntries(layers.map(([k])=>[k,k==='base'?' ':'']));const initial=()=>Array.from({length:8},(_,i)=>({...blank(),base:i===0?'꒰':i===7?'꒱':' ',top1:i===1?'︠':i===3?'̆':i===5?'︡':'',bottom1:i===2||i===5?'̮':'',overlay1:i>=1&&i<=6?['ₛ','ₑ','ₙ','ₛ','ₑ','ₛ'][i-1]:''}));let cells=initial(),active={i:1,id:'top1'},showAll=false,history=[],future=[],selected=0xFE20,rangeIndex=0,page=0,favOnly=false;let favorites=new Set([0xFE20,0xFE21,0x0306,0x032E,0x209B,0x2091,0x2099]);const $=id=>document.getElementById(id);const category=id=>id==='base'?'base':id.startsWith('top')?'top':id.startsWith('bottom')?'bottom':'overlay';const palettes={base:[' ','꒰','꒱','ξ','ε','3','◝','◜','ᵕ','ᴗ','(',')','ᑎ','ω'],top:['︠','︡','̆','̂','̃','̄','̇','̈','͡'],bottom:['̮','̯','̣','̤','̥','̰','̱'],overlay:['ₛ','ₑ','ₙ','ₐ','ₒ','ᵢ','ᵤ','ₓ','ₜ','ₚ','ₘ','ₖ','ₕ','ₗ','ᵣ','ᵥ']};const ranges=[['結合ダイアクリティカル記号',0x300,0x36F],['結合記号拡張',0x1AB0,0x1AFF],['結合記号補助',0x1DC0,0x1DFF],['記号用結合記号',0x20D0,0x20FF],['結合半記号',0xFE20,0xFE2F],['下付き・上付き',0x2070,0x209F],['音声記号拡張',0x1D00,0x1DBF],['IPA拡張',0x250,0x2AF],['修飾文字',0x2B0,0x2FF],['数学演算子',0x2200,0x22FF],['幾何学模様',0x25A0,0x25FF],['CJK記号・句読点',0x3000,0x303F],['彝文字',0xA000,0xA48F],['一般句読点',0x2000,0x206F],['矢印',0x2190,0x21FF],['装飾記号',0x2700,0x27BF],['その他の記号',0x2600,0x26FF]];const ch=n=>n>=0&&n<=0x10FFFF&&!(n>=0xD800&&n<=0xDFFF)?String.fromCodePoint(n):'';const isComb=n=>ranges.slice(0,5).some((r)=>n>=r[1]&&n<=r[2]);const label=n=>isComb(n)?'◌'+ch(n):ch(n);const hex=n=>n.toString(16).toUpperCase().padStart(4,'0');const compose=c=>(($('overlayOn').checked&&overlays.some(k=>c[k]))?overlays.map(k=>c[k]).join(''):c.base)+order.map(k=>c[k]).join('');const output=()=>cells.map(compose).join('');const snapshot=()=>cells.map(c=>({...c}));function patch(i,id,v){history.push(snapshot());if(history.length>60)history.shift();future=[];cells[i][id]=v;render()}function render(){ $('face').textContent=output();$('count').textContent=cells.length;const visible=layers.filter(([k])=>showAll||['top2','top1','base','bottom1','overlay1'].includes(k));const grid=$('matrix');grid.replaceChildren();grid.style.gridTemplateColumns=`90px repeat(${cells.length}, minmax(60px,1fr))`;function item(text,cls){const el=document.createElement('div');el.className=cls;el.textContent=text;grid.append(el)}item('番地','head');cells.forEach((_,i)=>item(String(i+1),'head'));for(const [id,name] of visible){item(name,'rowlabel');cells.forEach((c,i)=>{const b=document.createElement('button');b.className='cell'+(active.i===i&&active.id===id?' active':'')+(c[id]?' filled':'');b.style.minHeight=$('cellHeight').value+'px';b.textContent=c[id]?(id==='base'&&c[id]===' '?'␣':category(id)==='top'||category(id)==='bottom'?'◌'+c[id]:c[id]):'·';b.onclick=()=>{active={i,id};render()};grid.append(b)})}const val=cells[active.i][active.id];$('activeLabel').textContent=`番地${active.i+1}・${layers.find(x=>x[0]===active.id)[1]}`;$('activeValue').textContent='現在：'+(val||'未設定');$('manual').value=val;const pal=$('palette');pal.replaceChildren();palettes[category(active.id)].forEach(s=>{const b=document.createElement('button');b.textContent=s===' '?'␣':category(active.id)==='top'||category(active.id)==='bottom'?'◌'+s:s;b.onclick=()=>patch(active.i,active.id,active.id==='base'?s:cells[active.i][active.id]+s);pal.append(b)});$('toggleLayers').textContent=showAll?'主要5レイヤーのみ表示 ▴':'全13レイヤーを表示 ▾';$('undo').disabled=!history.length;$('redo').disabled=!future.length}
function renderDict(){const [name,a,b]=ranges[rangeIndex];const maxPage=Math.ceil((b-a+1)/48);const points=favOnly?[...favorites]:Array.from({length:Math.min(48,b-a+1-page*48)},(_,i)=>a+page*48+i);$('pageInfo').textContent=favOnly?'お気に入り':`${name} ${page+1}/${maxPage}`;$('prev').disabled=favOnly||page===0;$('next').disabled=favOnly||page===maxPage-1;$('favorites').textContent=favOnly?'範囲に戻る':'☆ お気に入り';const root=$('symbols');root.replaceChildren();points.forEach(n=>{const b=document.createElement('button');b.textContent=label(n);b.title='U+'+hex(n);if(n===selected)b.classList.add('active');b.onclick=()=>{selected=n;$('hex').value=hex(n);renderDict()};root.append(b)});$('selectedSymbol').textContent=label(selected);$('selectedCode').textContent='U+'+hex(selected);$('star').textContent=favorites.has(selected)?'★':'☆'}
$('range').replaceChildren();ranges.forEach(([name,a,b],i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=`${name} · U+${hex(a)}–${hex(b)}`;$('range').append(opt)});$('copy').onclick=()=>copy(output());$('copySymbol').onclick=()=>copy(ch(selected));async function copy(s){try{await navigator.clipboard.writeText(s);$('copyStatus').textContent='コピーしました'}catch(e){$('copyStatus').textContent='コピーできませんでした。HTTPSで開いてください'}}$('minus').onclick=()=>{if(cells.length>2){cells.pop();active.i=Math.min(active.i,cells.length-1);render()}};$('plus').onclick=()=>{if(cells.length<16){cells.push(blank());render()}};$('overlayOn').onchange=render;$('toggleLayers').onclick=()=>{showAll=!showAll;render()};$('clear').onclick=()=>patch(active.i,active.id,'');$('manual').oninput=e=>patch(active.i,active.id,e.target.value);$('backspace').onclick=()=>patch(active.i,active.id,Array.from(cells[active.i][active.id]).slice(0,-1).join(''));$('undo').onclick=()=>{if(!history.length)return;future.push(snapshot());cells=history.pop();render()};$('redo').onclick=()=>{if(!future.length)return;history.push(snapshot());cells=future.pop();render()};$('range').onchange=e=>{rangeIndex=+e.target.value;page=0;favOnly=false;renderDict()};$('prev').onclick=()=>{page--;renderDict()};$('next').onclick=()=>{page++;renderDict()};$('favorites').onclick=()=>{favOnly=!favOnly;renderDict()};$('star').onclick=()=>{favorites.has(selected)?favorites.delete(selected):favorites.add(selected);renderDict()};$('jump').onclick=()=>{const text=$('hex').value.trim().replace(/^U\+/i,'');if(!/^[0-9a-f]{1,6}$/i.test(text))return;const n=parseInt(text,16);if(!ch(n))return;selected=n;const ix=ranges.findIndex(r=>n>=r[1]&&n<=r[2]);if(ix>=0){rangeIndex=ix;$('range').value=String(ix);page=Math.floor((n-ranges[ix][1])/48);favOnly=false}renderDict()};$('insertSymbol').onclick=()=>patch(active.i,active.id,active.id==='base'?ch(selected):cells[active.i][active.id]+ch(selected));$('fontSize').oninput=e=>{$('face').style.fontSize=e.target.value+'px';$('fontSizeValue').textContent=e.target.value+'px'};$('cellHeight').oninput=e=>{$('cellHeightValue').textContent=e.target.value+'px';render()};$('reset').onclick=()=>{cells=initial();history=[];future=[];active={i:1,id:'top1'};$('overlayOn').checked=true;render()};render();renderDict();
</script></body></html>
